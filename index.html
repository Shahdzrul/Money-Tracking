<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Apple Money Tracker</title>

  <!-- iOS / Apple Web Clip Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Money" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/sf-ultralight-filled/192/007aff/wallet.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#F2F2F7] text-slate-900 min-h-screen pb-12 select-none">

  <!-- Apple Status / Top Bar -->
  <div class="sticky top-0 z-30 bg-[#F2F2F7]/80 backdrop-blur-md border-b border-black/5 px-5 py-4 flex items-center justify-between">
    <div>
      <span class="text-xs uppercase font-medium tracking-wide text-slate-500">Overview</span>
      <h1 class="text-2xl font-bold tracking-tight text-black">Wallet</h1>
    </div>
    <button onclick="exportCSV()" class="text-sm font-semibold text-[#007AFF] hover:opacity-75 transition">
      Export CSV
    </button>
  </div>

  <!-- iOS Banner Toast for Shortcut Entries -->
  <div id="toast" class="hidden mx-4 mt-3 p-3 bg-emerald-500 text-white rounded-xl text-xs font-semibold shadow-lg text-center transition-all duration-300">
    ⚡ Added automatically via Apple Shortcut!
  </div>

  <div class="max-w-md mx-auto px-4 mt-4 space-y-5">

    <!-- iOS Summary Widget Card -->
    <div class="bg-white rounded-3xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200/50">
      <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Current Balance</div>
      <div id="balance" class="text-3xl font-extrabold text-slate-900 mt-1">$0.00</div>

      <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
        <div>
          <span class="text-xs font-medium text-slate-400">Income</span>
          <p id="totalIncome" class="text-base font-bold text-emerald-600">+$0.00</p>
        </div>
        <div>
          <span class="text-xs font-medium text-slate-400">Expenses</span>
          <p id="totalExpense" class="text-base font-bold text-rose-500">-$0.00</p>
        </div>
      </div>
    </div>

    <!-- Quick Add Section -->
    <div class="bg-white rounded-3xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200/50">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Add Entry</h2>
        <!-- iOS Segmented Control -->
        <div class="flex bg-slate-100 rounded-full p-0.5 text-xs font-semibold">
          <button id="typeExpense" type="button" onclick="setType('expense')" class="px-3 py-1 rounded-full bg-white text-slate-900 shadow-sm transition">Expense</button>
          <button id="typeIncome" type="button" onclick="setType('income')" class="px-3 py-1 rounded-full text-slate-500 transition">Income</button>
        </div>
      </div>

      <form id="txForm" class="space-y-3">
        <div class="flex items-center bg-[#F2F2F7] rounded-xl px-4 py-3">
          <span class="text-xl font-bold text-slate-400 mr-2">$</span>
          <input type="number" step="0.01" min="0.01" id="amount" placeholder="0.00" required
            class="w-full bg-transparent text-xl font-bold text-slate-900 focus:outline-none placeholder:text-slate-300" />
        </div>

        <input type="text" id="desc" placeholder="Note (e.g., Starbucks, Lunch)" required
          class="w-full bg-[#F2F2F7] rounded-xl px-4 py-3 text-sm focus:outline-none placeholder:text-slate-400" />

        <div class="grid grid-cols-2 gap-2">
          <select id="category" class="bg-[#F2F2F7] rounded-xl px-3 py-3 text-xs font-medium text-slate-700 focus:outline-none">
            <option value="Food">🍽️ Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">🧾 Bills</option>
            <option value="Salary">💰 Salary</option>
            <option value="Other">🏷️ Other</option>
          </select>

          <input type="date" id="date" required
            class="bg-[#F2F2F7] rounded-xl px-3 py-3 text-xs font-medium text-slate-700 focus:outline-none" />
        </div>

        <button type="submit" class="w-full mt-2 py-3.5 bg-[#007AFF] active:scale-[0.98] text-white font-semibold rounded-2xl text-sm transition">
          Log Entry
        </button>
      </form>
    </div>

    <!-- History List -->
    <div>
      <div class="flex justify-between items-center mb-2 px-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Activity</h3>
        <button onclick="clearAll()" class="text-xs font-semibold text-rose-500 hover:opacity-75">Clear All</button>
      </div>

      <div id="txList" class="bg-white rounded-3xl overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200/50 divide-y divide-slate-100">
        <!-- Rendered items go here -->
      </div>
      <p id="emptyNote" class="text-center text-xs text-slate-400 py-8 hidden">No transactions recorded yet.</p>
    </div>

  </div>

  <script>
    let currentType = 'expense';
    let transactions = JSON.parse(localStorage.getItem('apple_shortcut_tracker')) || [];

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    function setType(type) {
      currentType = type;
      const expBtn = document.getElementById('typeExpense');
      const incBtn = document.getElementById('typeIncome');

      if (type === 'expense') {
        expBtn.className = 'px-3 py-1 rounded-full bg-white text-slate-900 shadow-sm transition';
        incBtn.className = 'px-3 py-1 rounded-full text-slate-500 transition';
      } else {
        incBtn.className = 'px-3 py-1 rounded-full bg-white text-slate-900 shadow-sm transition';
        expBtn.className = 'px-3 py-1 rounded-full text-slate-500 transition';
      }
    }

    function formatMoney(num) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }

    function saveAndRender() {
      localStorage.setItem('apple_shortcut_tracker', JSON.stringify(transactions));

      const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

      document.getElementById('balance').textContent = formatMoney(income - expense);
      document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
      document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);

      const list = document.getElementById('txList');
      const emptyNote = document.getElementById('emptyNote');
      list.innerHTML = '';

      if (transactions.length === 0) {
        emptyNote.classList.remove('hidden');
        list.classList.add('hidden');
      } else {
        emptyNote.classList.add('hidden');
        list.classList.remove('hidden');
      }

      transactions.slice().reverse().forEach(tx => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-3.5 hover:bg-slate-50 transition';

        const isInc = tx.type === 'income';
        const color = isInc ? 'text-emerald-600' : 'text-slate-900';
        const sign = isInc ? '+' : '-';

        row.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full ${isInc ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-600'} flex items-center justify-center text-sm font-semibold">
              ${tx.category.slice(0, 2)}
            </div>
            <div>
              <p class="text-sm font-semibold text-slate-900">${tx.desc}</p>
              <p class="text-[11px] text-slate-400">${tx.category} • ${tx.date}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-bold ${color}">${sign}${formatMoney(tx.amount)}</span>
            <button onclick="removeTx('${tx.id}')" class="text-slate-300 hover:text-rose-500 px-1 text-sm">✕</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function addTransaction(desc, amount, type, category, date) {
      transactions.push({
        id: Date.now().toString(),
        desc,
        amount: parseFloat(amount),
        type,
        category: category || 'Other',
        date: date || new Date().toISOString().split('T')[0]
      });
      saveAndRender();
    }

    document.getElementById('txForm').addEventListener('submit', (e) => {
      e.preventDefault();
      addTransaction(
        document.getElementById('desc').value.trim(),
        document.getElementById('amount').value,
        currentType,
        document.getElementById('category').value,
        document.getElementById('date').value
      );
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    });

    window.removeTx = function(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveAndRender();
    };

    window.clearAll = function() {
      if (confirm('Clear all entries?')) {
        transactions = [];
        saveAndRender();
      }
    };

    window.exportCSV = function() {
      if (transactions.length === 0) return alert('No records to export');
      let csv = 'Date,Type,Category,Description,Amount\n';
      transactions.forEach(t => {
        csv += `${t.date},${t.type},${t.category},"${t.desc.replace(/"/g, '""')}",${t.amount}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `money_tracker_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    };

    // Check if opened via Apple Shortcut with URL parameters
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const amount = urlParams.get('amount');
      const desc = urlParams.get('desc');
      const type = urlParams.get('type') || 'expense';
      const category = urlParams.get('category') || 'Other';

      if (amount && desc) {
        addTransaction(desc, amount, type, category);
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3500);

        // Clean the URL without refreshing
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        saveAndRender();
      }
    });
  </script>
</body>
</html>
